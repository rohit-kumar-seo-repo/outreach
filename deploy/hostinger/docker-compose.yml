# Rohit Kumar SEO Outreach, as a Hostinger Docker Manager project (hPanel → VPS → Docker Manager).
#
# Docker Manager only pulls images; it never builds them. So this project uses public images only:
#   - "builder" (node:22-alpine) clones this repository at GIT_REF, builds it and copies the
#     release into the outreach_release volume, then exits;
#   - migrate, app and worker run that release with node:22-alpine;
#   - backup runs pg_dump nightly with postgres:16-alpine.
# HTTPS is handled by the VPS's existing Traefik project (entrypoint "websecure", Let's Encrypt
# resolver "letsencrypt"), the same way as the other projects on this VPS.
# Every secret comes from the project's Environment variables in hPanel. This file contains
# none, so it is safe to keep in the repository. See docs/SETUP.md for the full list.
# To deploy a new version: redeploy the project (the builder rebuilds from GIT_REF).

x-release: &release
  image: node:22-alpine
  user: node
  working_dir: /app
  restart: unless-stopped
  volumes:
    - outreach_release:/app:ro
  # Lets the containers reach n8n and WAHA through their published ports on this VPS
  # (e.g. N8N_BASE_URL=http://host.docker.internal:<n8n port>) without leaving the machine.
  extra_hosts:
    - "host.docker.internal:host-gateway"
  environment:
    NODE_ENV: production
    NEXT_TELEMETRY_DISABLED: "1"
    PORT: "3000"
    HOSTNAME: 0.0.0.0
    DATABASE_URL: postgres://outreach:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/outreach
    PUBLIC_URL: ${PUBLIC_URL:-https://outreach.rohitkumarseo.com}
    APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Kolkata}
    ADMIN_EMAIL: ${ADMIN_EMAIL:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
    ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    ADMIN_TOTP_SECRET: ${ADMIN_TOTP_SECRET:-}
    SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
    N8N_BASE_URL: ${N8N_BASE_URL:-}
    N8N_API_KEY: ${N8N_API_KEY:-}
    N8N_BRIDGE_URL: ${N8N_BRIDGE_URL:-}
    N8N_BRIDGE_KEY: ${N8N_BRIDGE_KEY:-}
    INGEST_KEY: ${INGEST_KEY:-}
    HOSTINGER_MAIL_TOKENS: ${HOSTINGER_MAIL_TOKENS:-}
    IMAP_ACCOUNTS_JSON: ${IMAP_ACCOUNTS_JSON:-}
    MAIL_INITIAL_SYNC_DAYS: ${MAIL_INITIAL_SYNC_DAYS:-120}
    WAHA_BASE_URL: ${WAHA_BASE_URL:-}
    WAHA_API_KEY: ${WAHA_API_KEY:-}
    TZ: ${APP_TIMEZONE:-Asia/Kolkata}
  depends_on:
    db:
      condition: service_healthy
    builder:
      condition: service_completed_successfully

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: outreach
      POSTGRES_DB: outreach
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
    volumes:
      - outreach_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U outreach -d outreach"]
      interval: 10s
      timeout: 5s
      retries: 10

  builder:
    image: node:22-alpine
    restart: "no"
    environment:
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - outreach_release:/release
    command:
      - /bin/sh
      - -ec
      - |
        apk add --no-cache git >/dev/null
        rm -rf /tmp/src
        git clone --quiet --depth 1 --branch "${GIT_REF:-main}" https://github.com/rohit-kumar-seo-repo/outreach.git /tmp/src
        cd /tmp/src
        echo "building $$(git rev-parse --short HEAD) from ${GIT_REF:-main}"
        npm ci --no-audit --no-fund
        npm run build
        npm prune --omit=dev --no-audit --no-fund
        rm -rf /tmp/out && mkdir -p /tmp/out/.next /tmp/out/deploy
        cp -a .next/standalone/. /tmp/out/
        cp -a .next/static /tmp/out/.next/static
        mkdir -p /tmp/out/.next/cache
        cp -a public dist db config /tmp/out/
        cp -a node_modules/. /tmp/out/node_modules/
        cp deploy/backup.sh /tmp/out/deploy/backup.sh
        find /release -mindepth 1 -delete
        cp -a /tmp/out/. /release/
        chown -R 1000:1000 /release
        echo "release ready"

  migrate:
    <<: *release
    command: ["node", "dist/cli/migrate.js"]
    restart: "no"

  app:
    <<: *release
    command: ["node", "server.js"]
    # The release volume is read-only; Next.js may still write its cache.
    tmpfs:
      - /app/.next/cache:mode=1777
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    labels:
      - traefik.enable=true
      - traefik.http.routers.rks-outreach.rule=Host(`${DOMAIN:-outreach.rohitkumarseo.com}`)
      - traefik.http.routers.rks-outreach.entrypoints=websecure
      - traefik.http.routers.rks-outreach.tls.certresolver=letsencrypt
      - traefik.http.services.rks-outreach.loadbalancer.server.port=3000
    # No published port: Traefik (host network) reaches the container directly, so the app is
    # only reachable over HTTPS through Traefik.

  worker:
    <<: *release
    command: ["node", "dist/worker/index.js"]
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/app/deploy/backup.sh"]
    environment:
      PGHOST: db
      PGUSER: outreach
      PGDATABASE: outreach
      PGPASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      TZ: ${APP_TIMEZONE:-Asia/Kolkata}
      BACKUP_AT: ${BACKUP_AT:-02:30}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - outreach_release:/app:ro
      - outreach_backups:/backups
    depends_on:
      db:
        condition: service_healthy
      builder:
        condition: service_completed_successfully

volumes:
  outreach_db:
  outreach_release:
  outreach_backups:
